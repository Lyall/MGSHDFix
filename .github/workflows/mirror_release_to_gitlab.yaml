name: Mirror Release to GitLab

on:
  release:
    types:
      - published

jobs:
  sync-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Sync repository to GitLab
        uses: kujov/gitlab-sync@main
        with:
          gitlab_url: ${{ secrets.GITLAB_URL }}
          username: ${{ secrets.GITLAB_USERNAME }}
          gitlab_pat: ${{ secrets.GITLAB_PAT }}
          git_lfs: true

  sync-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: sync-repo

    steps:
      - name: Mirror GitHub release to GitLab
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,name,body,assets)

          RELEASE_NAME=$(echo "$release_json" | jq -r '.name')
          RELEASE_BODY=$(echo "$release_json" | jq -r '.body')
          asset_count=$(echo "$release_json" | jq '.assets | length')

          rm -rf release_assets
          mkdir -p release_assets

          if [ "$asset_count" -gt 0 ]; then
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release_assets
          fi

          args=()
          args+=(--request POST)
          args+=(--header "PRIVATE-TOKEN: ${GITLAB_PAT}")
          args+=(--data-urlencode "name=${RELEASE_NAME}")
          args+=(--data-urlencode "tag_name=${RELEASE_TAG}")
          args+=(--data-urlencode "description=${RELEASE_BODY}")

          index=0

          for file in release_assets/*; do
            if [ ! -f "$file" ]; then
              continue
            fi

            filename=$(basename "$file")

            upload_json=$(curl --fail-with-body --silent --show-error --request POST \
              --header "PRIVATE-TOKEN: ${GITLAB_PAT}" \
              --form "file=@${file}" \
              "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/uploads")

            uploaded_path=$(echo "$upload_json" | jq -r '.full_path // .url // empty')

            if [ -z "$uploaded_path" ]; then
              echo "GitLab upload did not return a usable path for ${filename}:"
              echo "$upload_json"
              exit 1
            fi

            if [[ "$uploaded_path" == http://* || "$uploaded_path" == https://* ]]; then
              uploaded_url="$uploaded_path"
            else
              uploaded_url="https://gitlab.com${uploaded_path}"
            fi

            args+=(--data-urlencode "assets[links][$index][name]=${filename}")
            args+=(--data-urlencode "assets[links][$index][url]=${uploaded_url}")
            args+=(--data-urlencode "assets[links][$index][link_type]=package")

            index=$((index + 1))
          done

          encoded_tag=$(jq -rn --arg v "$RELEASE_TAG" '$v|@uri')

          curl --silent --output /dev/null --request DELETE \
            --header "PRIVATE-TOKEN: ${GITLAB_PAT}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/releases/${encoded_tag}"

          curl --fail-with-body --silent --show-error "${args[@]}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/releases"
